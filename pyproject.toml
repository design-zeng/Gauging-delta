[project]
name = "gauging-delta"
version = "0.1.0"
description = "Gauging-δ: A Non-Parametric Hierarchical Clustering Algorithm"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "Jinli Yao"},
    {name = "Jie Pan"},
    {name = "Yong Zeng"},
]
keywords = ["clustering", "hierarchical", "non-parametric", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "matplotlib>=3.9.4",
    "numpy>=1.24.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]
bench = [
    "psutil>=5.9.0",
    "scienceplots>=2.1.0",
    "memray>=1.0.0",
]
all = [
    "gauging-delta[dev,bench]",
]

[project.urls]
Homepage = "https://github.com/design-zeng/Gauging-delta"
Repository = "https://github.com/design-zeng/Gauging-delta"
Documentation = "https://github.com/design-zeng/Gauging-delta#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauging_delta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "SIM108", # Use ternary operator (readability preference)
    "N803",   # Argument name should be lowercase (we use X like scikit-learn)
    "N806",   # Variable in function should be lowercase (we use C_i, T, F to match paper notation)
    "N802",   # Function name should be lowercase (we use T, F in function names)
    "RUF001", # Ambiguous unicode in string (we use ρ for rho)
    "RUF002", # Ambiguous unicode in docstring (we use × for multiplication)
    "RUF003", # Ambiguous unicode in comment (we use × for multiplication)
    "E741",   # Ambiguous variable name (we use l in comprehensions)
]

[tool.ruff.lint.isort]
known-first-party = ["gauging_delta"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM", "RUF005"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.coverage.run]
source = ["src/gauging_delta"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Allow assert statements
